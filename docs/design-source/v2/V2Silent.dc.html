<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#141311}
.ac{--ground:#141311;--raised:#1b1a17;--elevated:#24221e;--well:#0f0e0c;--ink:#ede9e1;--ink-2:#cbc6bb;--muted:#a39e94;--faint:#77726a;--hairline:#2b2925;--border:#6f6a61;--accent:#8dbfa8;--accent-hover:#b3d6c5;--on-accent:#10201a;--accent-tint:#1a2a23;--record:#e8775f;--record-tint:#2e1a15;--caution:#dcac5c;--caution-tint:#2c2416;--p1:oklch(0.34 0.05 255);--p1i:oklch(0.88 0.06 255);--p2:oklch(0.34 0.05 290);--p2i:oklch(0.88 0.06 290);--p3:oklch(0.34 0.05 325);--p3i:oklch(0.88 0.06 325);--p4:oklch(0.34 0.05 215);--p4i:oklch(0.88 0.06 215);--p5:oklch(0.34 0.05 110);--p5i:oklch(0.88 0.06 110);--p6:oklch(0.34 0.05 355);--p6i:oklch(0.88 0.06 355);--sh1:0 0 0 1px rgba(255,255,255,0.05),0 1px 2px rgba(0,0,0,0.30);--sh2:0 0 0 1px rgba(255,255,255,0.08),0 6px 16px rgba(0,0,0,0.35);--shpill:0 0 0 1px rgba(255,255,255,0.08),0 12px 32px rgba(0,0,0,0.50);--shfloat:0 0 0 1px rgba(255,255,255,0.06),0 24px 56px rgba(0,0,0,0.50);--ease:cubic-bezier(.2,.8,.2,1);--serif:Newsreader,'Iowan Old Style',Georgia,serif;--sans:'Instrument Sans',-apple-system,BlinkMacSystemFont,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;color-scheme:dark;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:21px;-webkit-font-smoothing:antialiased}
.ac.light{--ground:#f4f1ea;--raised:#fbf9f4;--elevated:#ffffff;--well:#ebe7de;--ink:#1d1b17;--ink-2:#3d3a35;--muted:#65605a;--faint:#8a847a;--hairline:#e2ddd2;--border:#8c867b;--accent:#2d5e4f;--accent-hover:#234a3e;--on-accent:#ffffff;--accent-tint:#e3ece6;--record:#b3412d;--record-tint:#f7e6e0;--caution:#855610;--caution-tint:#f4ead6;--p1:oklch(0.90 0.045 255);--p1i:oklch(0.36 0.08 255);--p2:oklch(0.90 0.045 290);--p2i:oklch(0.36 0.08 290);--p3:oklch(0.90 0.045 325);--p3i:oklch(0.36 0.08 325);--p4:oklch(0.90 0.045 215);--p4i:oklch(0.36 0.08 215);--p5:oklch(0.90 0.045 110);--p5i:oklch(0.36 0.08 110);--p6:oklch(0.90 0.045 355);--p6i:oklch(0.36 0.08 355);--sh1:0 0 0 1px rgba(29,27,23,0.07),0 1px 2px rgba(29,27,23,0.04);--sh2:0 0 0 1px rgba(29,27,23,0.09),0 6px 16px rgba(29,27,23,0.06);--shpill:0 0 0 1px rgba(29,27,23,0.08),0 12px 32px rgba(29,27,23,0.12);--shfloat:0 0 0 1px rgba(29,27,23,0.06),0 24px 56px rgba(29,27,23,0.12);color-scheme:light}
.ac a{color:var(--accent);text-decoration:none}.ac a:hover{color:var(--accent-hover)}
.ac button,.ac input,.ac textarea,.ac select{font-family:inherit;font-size:inherit;color:inherit}
.ac button{cursor:pointer}
.ac :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ac .press{transition:transform 120ms var(--ease),background-color 120ms var(--ease),box-shadow 160ms var(--ease),color 120ms var(--ease)}
.ac .press:active{transform:scale(.97)}
.ac .lift{transition:box-shadow 160ms var(--ease),transform 160ms var(--ease)}
.ac .lift:hover{box-shadow:var(--sh2)}
.ac .row:hover{background:var(--elevated)}
.ac .quiet:hover{color:var(--ink)}
.ac .primary:hover{background:var(--accent-hover)}
.ac .secondary:hover{background:var(--elevated)}
.ac .field:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);outline:none}
@keyframes ac-bar{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@keyframes ac-breathe{0%,100%{box-shadow:0 0 0 0 rgba(232,119,95,.45)}50%{box-shadow:0 0 0 6px rgba(232,119,95,0)}}
@keyframes ac-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ac-pop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes ac-draw{from{stroke-dashoffset:14}to{stroke-dashoffset:0}}
@keyframes ac-fill{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ac-strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ac-roll{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes ac-rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes ac-countdown{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes ac-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ac *{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div class="ac {{theme}}" style="width: 440px; height: 520px; box-sizing: border-box; background: var(--ground); overflow: hidden; display: flex; align-items: center; justify-content: center;">

  <div role="group" aria-label="Recording controls" style="display: inline-flex; flex-direction: column; border-radius: 24px; background: var(--elevated); box-shadow: var(--shpill); animation: ac-in 320ms var(--ease) both;">

    <div style="display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 16px;">
      <span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 999px; background: var(--record); animation: ac-breathe 2s ease-in-out infinite;"></span>
      <span style="font-family: var(--mono); font-size: 15px; font-weight: 500; min-width: 48px; letter-spacing: -0.01em;">{{timer}}</span>
      <span aria-label="Your mic" role="img" style="display: inline-flex; align-items: center; gap: 2px; height: 22px;">
        <span style="width: 3px; height: 22px; border-radius: 2px; background: var(--accent); animation: ac-bar 820ms ease-in-out -120ms infinite;"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: var(--accent); animation: ac-bar 640ms ease-in-out -340ms infinite;"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: var(--accent); animation: ac-bar 900ms ease-in-out -520ms infinite;"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: var(--accent); animation: ac-bar 700ms ease-in-out -80ms infinite;"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: var(--accent); animation: ac-bar 760ms ease-in-out -410ms infinite;"></span>
      </span>
      <span aria-label="The call, silent" role="img" style="display: inline-flex; align-items: center; gap: 2px; height: 22px;">
        <span style="width: 3px; height: 22px; border-radius: 2px; background: var(--caution); transform: scaleY(.18);"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: var(--caution); transform: scaleY(.18);"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: var(--caution); transform: scaleY(.18);"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: var(--caution); transform: scaleY(.18);"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: var(--caution); transform: scaleY(.18);"></span>
      </span>
      <button class="press quiet" style="height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--well); color: var(--ink-2); font-weight: 600; display: inline-flex; align-items: center; gap: 6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Note</button>
      <button aria-label="Pause" class="press" style="width: 32px; height: 32px; border: 0; border-radius: 999px; background: var(--well); color: var(--ink); display: inline-flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <a href="V2Processing.dc.html" class="press" style="height: 32px; padding: 0 14px; border-radius: 999px; background: var(--record); color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 2px; background: #fff;"></span>Stop</a>
    </div>

    <div aria-hidden="true" style="height: 1px; margin: 0 16px; background: var(--hairline);"></div>

    <div role="alert" style="width: 0; min-width: 100%; box-sizing: border-box; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; animation: ac-in 320ms 160ms var(--ease) both;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: var(--caution-tint); color: var(--caution); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; animation: ac-pop 320ms 240ms var(--ease) both;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
          <span style="font-size: 16px; line-height: 22px; font-weight: 600;">No sound from the call for 30 s</span>
          <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--muted);">Your mic is still recording</span>
        </span>
      </div>

      <p style="margin: 0; color: var(--ink-2);">If others are talking, macOS may be keeping the call's audio from Aftercall. Allow it here:</p>

      <div style="padding: 10px 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--hairline); font-size: 13px; line-height: 20px; color: var(--ink);">System Settings <span aria-hidden="true" style="color: var(--muted);">›</span> Privacy &amp; Security <span aria-hidden="true" style="color: var(--muted);">›</span> <span style="font-weight: 600;">Screen &amp; System Audio Recording</span></div>

      <div style="display: flex; gap: 20px; font-size: 12px; line-height: 16px; color: var(--muted);">
        <span style="display: inline-flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: var(--accent);"></span>You (mic) · live</span>
        <span style="display: inline-flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: var(--caution);"></span>The call · silent</span>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 2px;">
        <button class="press primary" style="flex: 1; height: 38px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">Open System Settings<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></button>
        <button class="press secondary" style="height: 38px; padding: 0 14px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--ink); font-weight: 600;">Keep recording</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":440,"height":520}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sec: 41 };
  }
  componentDidMount() {
    this.timerId = setInterval(() => this.setState({ sec: this.state.sec + 1 }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timerId);
  }
  renderVals() {
    const s = this.state.sec;
    return {
      theme: this.props.theme === 'light' ? 'light' : '',
      timer: String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')
    };
  }
}
</script>
