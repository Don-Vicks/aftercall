<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aftercall · New project</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#141311}
.ac{--ground:#141311;--raised:#1b1a17;--elevated:#24221e;--well:#0f0e0c;--ink:#ede9e1;--ink-2:#cbc6bb;--muted:#a39e94;--faint:#77726a;--hairline:#2b2925;--border:#6f6a61;--accent:#8dbfa8;--accent-hover:#b3d6c5;--on-accent:#10201a;--accent-tint:#1a2a23;--record:#e8775f;--record-tint:#2e1a15;--caution:#dcac5c;--caution-tint:#2c2416;--p1:oklch(0.34 0.05 255);--p1i:oklch(0.88 0.06 255);--p2:oklch(0.34 0.05 290);--p2i:oklch(0.88 0.06 290);--p3:oklch(0.34 0.05 325);--p3i:oklch(0.88 0.06 325);--p4:oklch(0.34 0.05 215);--p4i:oklch(0.88 0.06 215);--p5:oklch(0.34 0.05 110);--p5i:oklch(0.88 0.06 110);--p6:oklch(0.34 0.05 355);--p6i:oklch(0.88 0.06 355);--sh1:0 0 0 1px rgba(255,255,255,0.05),0 1px 2px rgba(0,0,0,0.30);--sh2:0 0 0 1px rgba(255,255,255,0.08),0 6px 16px rgba(0,0,0,0.35);--shpill:0 0 0 1px rgba(255,255,255,0.08),0 12px 32px rgba(0,0,0,0.50);--shfloat:0 0 0 1px rgba(255,255,255,0.06),0 24px 56px rgba(0,0,0,0.50);--ease:cubic-bezier(.2,.8,.2,1);--serif:Newsreader,'Iowan Old Style',Georgia,serif;--sans:'Instrument Sans',-apple-system,BlinkMacSystemFont,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;color-scheme:dark;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:21px;-webkit-font-smoothing:antialiased}
.ac.light{--ground:#f4f1ea;--raised:#fbf9f4;--elevated:#ffffff;--well:#ebe7de;--ink:#1d1b17;--ink-2:#3d3a35;--muted:#65605a;--faint:#8a847a;--hairline:#e2ddd2;--border:#8c867b;--accent:#2d5e4f;--accent-hover:#234a3e;--on-accent:#ffffff;--accent-tint:#e3ece6;--record:#b3412d;--record-tint:#f7e6e0;--caution:#855610;--caution-tint:#f4ead6;--p1:oklch(0.90 0.045 255);--p1i:oklch(0.36 0.08 255);--p2:oklch(0.90 0.045 290);--p2i:oklch(0.36 0.08 290);--p3:oklch(0.90 0.045 325);--p3i:oklch(0.36 0.08 325);--p4:oklch(0.90 0.045 215);--p4i:oklch(0.36 0.08 215);--p5:oklch(0.90 0.045 110);--p5i:oklch(0.36 0.08 110);--p6:oklch(0.90 0.045 355);--p6i:oklch(0.36 0.08 355);--sh1:0 0 0 1px rgba(29,27,23,0.07),0 1px 2px rgba(29,27,23,0.04);--sh2:0 0 0 1px rgba(29,27,23,0.09),0 6px 16px rgba(29,27,23,0.06);--shpill:0 0 0 1px rgba(29,27,23,0.08),0 12px 32px rgba(29,27,23,0.12);--shfloat:0 0 0 1px rgba(29,27,23,0.06),0 24px 56px rgba(29,27,23,0.12);color-scheme:light}
.ac a{color:var(--accent);text-decoration:none}.ac a:hover{color:var(--accent-hover)}
.ac button,.ac input,.ac textarea,.ac select{font-family:inherit;font-size:inherit;color:inherit}
.ac button{cursor:pointer}
.ac :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ac .press{transition:transform 120ms var(--ease),background-color 120ms var(--ease),box-shadow 160ms var(--ease),color 120ms var(--ease)}
.ac .press:active{transform:scale(.97)}
.ac .lift{transition:box-shadow 160ms var(--ease),transform 160ms var(--ease)}
.ac .lift:hover{box-shadow:var(--sh2)}
.ac .row:hover{background:var(--elevated)}
.ac .quiet:hover{color:var(--ink)}
.ac .primary:hover{background:var(--accent-hover)}
.ac .secondary:hover{background:var(--elevated)}
.ac .field:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);outline:none}
@keyframes ac-bar{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@keyframes ac-breathe{0%,100%{box-shadow:0 0 0 0 rgba(232,119,95,.45)}50%{box-shadow:0 0 0 6px rgba(232,119,95,0)}}
@keyframes ac-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ac-pop{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes ac-draw{from{stroke-dashoffset:14}to{stroke-dashoffset:0}}
@keyframes ac-fill{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ac-strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ac-roll{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
@keyframes ac-rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
@keyframes ac-countdown{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes ac-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ac *{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div class="ac {{theme}}" style="width: 560px; height: 460px; box-sizing: border-box; padding: 32px; background: var(--ground); display: flex; align-items: center; justify-content: center;">
  <div role="dialog" aria-labelledby="np-title" style="width: 100%; box-sizing: border-box; padding: 26px 28px 24px; border-radius: 20px; background: var(--elevated); box-shadow: var(--shfloat); display: flex; flex-direction: column; gap: 20px; animation: ac-in 280ms var(--ease) both;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <h1 id="np-title" style="margin: 0; font-family: var(--serif); font-size: 28px; line-height: 34px; font-weight: 500; letter-spacing: -0.015em;">New project</h1>
        <p style="margin: 0; color: var(--ink-2);">What a set of meetings is about, like a client, a fundraise or a hire.</p>
      </div>
      <button aria-label="Close" class="press quiet" style="width: 32px; height: 32px; margin: -2px -6px 0 0; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="np-name" style="font-size: 13px; line-height: 18px; font-weight: 600;">Name</label>
      <input id="np-name" class="field" value="Website relaunch" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--well); font-size: 15px;">
      <span style="font-size: 13px; color: var(--ink-2);">Its name also helps transcription spell it right.</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px;">
      <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--muted);"><kbd style="font-family: var(--mono); font-size: 11px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 6px; background: var(--well); color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px var(--hairline);">↵</kbd>to create</span>
      <span style="display: flex; gap: 8px;">
        <button class="press quiet" style="height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-weight: 600;">Cancel</button>
        <button class="press primary" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600;">Create project</button>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":560,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme === 'light' ? 'light' : '' };
  }
}
</script>
</body>
</html>
