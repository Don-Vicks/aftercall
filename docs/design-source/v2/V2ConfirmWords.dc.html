<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":720,"height":700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 0, shake: 0 };
    this.timers = [];
  }
  componentWillUnmount() {
    this.clearShake();
  }
  clearShake() {
    this.timers.forEach((t) => clearTimeout(t));
    this.timers = [];
  }
  fill() {
    const next = (this.state.stage + 1) % 3;
    this.clearShake();
    this.setState({ stage: next, shake: 0 });
    if (next === 1) {
      const seq = [-6, 6, -4, 4, -2, 0];
      this.timers = seq.map((x, i) => setTimeout(() => this.setState({ shake: x }), 240 + i * 55));
    }
  }
  renderVals() {
    const st = this.state.stage;
    const ok04 = st >= 1;
    const ok08 = st === 2;
    const ok11 = st === 2;
    const bad11 = st === 1;
    const border = (ok, bad) => ok ? 'var(--accent)' : bad ? 'var(--record)' : 'var(--border)';
    return {
      theme: this.props.theme === 'light' ? 'light' : '',
      v04: ok04 ? '[word 4]' : '',
      v08: ok08 ? '[word 8]' : '',
      v11: ok11 ? '[word 11]' : bad11 ? '[a different word]' : '',
      b04: border(ok04, false),
      b08: border(ok08, false),
      b11: border(ok11, bad11),
      inv04: 'false',
      inv08: 'false',
      inv11: bad11 ? 'true' : 'false',
      ok04: ok04,
      ok08: ok08,
      ok11: ok11,
      bad04: false,
      bad08: false,
      bad11: bad11,
      shake11: this.state.shake,
      allMatch: ok04 && ok08 && ok11,
      notAllMatch: !(ok04 && ok08 && ok11),
      fillLabel: st === 0 ? 'Fill sample' : st === 1 ? 'Fill correct words' : 'Clear',
      fill: () => this.fill()
    };
  }
}
</script>
