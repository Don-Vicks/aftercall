<style>

<div class="ac {{theme}}" style="position: relative; width: 720px; height: 700px; box-sizing: border-box; padding: 36px 48px; background: var(--ground); display: flex; align-items: center; justify-content: center; overflow: hidden;">

    <div style="position: relative; display: flex; flex-direction: column; border-radius: 14px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--hairline); overflow: hidden; animation: ac-in 320ms 80ms var(--ease) both;">

        <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10a7 7 0 0 1-14 0M12 17v5"/></svg></span>

          <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2);"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: var(--ink-2);"></span>The call, from any app</span>
        </span>
        <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
          <span role="img" aria-label="{{callLabel}}" style="display: inline-flex; align-items: center; gap: 2px; height: 24px;">
            <sc-for list="{{callBars}}" as="b" hint-placeholder-count="16">
              <span style="width: 3px; height: 24px; border-radius: 2px; background: {{ b.bg }}; transform: scaleY({{ b.s }}); animation: {{ b.anim }}; transition: background-color 200ms var(--ease);"></span>
            </sc-for>
          </span>
        </sc-if>
        <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
          <span role="status" style="height: 26px; padding: 0 10px 0 5px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; animation: ac-pop 320ms 140ms var(--ease) both;"><svg width="16" height="16" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" style="fill: var(--accent); transform-origin: 11px 11px; animation: ac-fill 320ms 140ms cubic-bezier(.3,1.5,.5,1) both;"/><path d="M6.5 11.5l3 3 6-6.5" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14" style="stroke: var(--on-accent); animation: ac-draw 240ms 300ms var(--ease) both;"/></svg>HEARD</span>
        </sc-if>

      <sc-if value="{{running}}" hint-placeholder-val="{{ false }}">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; animation: ac-in 320ms 160ms var(--ease) both;">

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":720,"height":700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'idle', left: 5 };
  }
  componentWillUnmount() {
    clearInterval(this.timerId);
  }
  start() {
    clearInterval(this.timerId);
    this.setState({ phase: 'running', left: 5 });
    this.timerId = setInterval(() => {
      const left = this.state.left - 1;
      if (left <= 0) {
        clearInterval(this.timerId);
        this.setState({ phase: 'done', left: 0 });
      } else {
        this.setState({ left: left });
      }
    }, 1000);
  }
  renderVals() {
    const phase = this.state.phase;
    const on = phase === 'running';
    const bars = (durs, dels, color) => durs.map((d, i) => ({
      bg: on ? color : 'var(--faint)',
      s: on ? 1 : 0.16,
      anim: on ? 'ac-bar ' + d + 'ms ease-in-out ' + dels[i] + 'ms infinite' : 'none'
    }));
    return {
      theme: this.props.theme === 'light' ? 'light' : '',
      idle: phase === 'idle',
      running: on,
      done: phase === 'done',
      notDone: phase !== 'done',
      left: this.state.left,
      micLabel: on ? 'Your microphone level' : 'Microphone, not listening yet',
      callLabel: on ? 'Call audio level' : 'Call audio, not listening yet',
      micBars: bars(
        [820, 640, 900, 700, 760, 880, 620, 980, 720, 840, 660, 940, 780, 700, 860, 740],
        [-120, -340, -520, -80, -410, -260, -600, -180, -450, -30, -370, -220, -560, -140, -300, -480],
        'var(--accent)'
      ),
      callBars: bars(
        [1100, 980, 1240, 860, 1020, 1180, 920, 1300, 1060, 960, 1140, 880, 1220, 1000, 1160, 940],
        [-300, -700, -150, -560, -90, -820, -430, -240, -660, -380, -50, -900, -510, -270, -740, -160],
        'var(--ink-2)'
      ),
      check: () => this.start()
    };
  }
}
</script>
