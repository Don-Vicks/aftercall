<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aftercall · menu bar, start recording</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=swap">
<style>
:root{color-scheme:dark}
body{margin:0;background:#141311}
a{color:#8dbfa8}a:hover{color:#b3d6c5}
button,select{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 470px; box-sizing: border-box; padding: 16px; background: #24221e; border-radius: 14px; box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 48px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 16px; color: #ede9e1; font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; line-height: 19px;">
  <div style="display: flex; align-items: baseline; justify-content: space-between;">
    <span style="font-family: Newsreader, Georgia, serif; font-size: 18px; line-height: 22px; font-weight: 500;">Aftercall</span>
    <span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; color: #a39e94;">READY</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <label for="proj" style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; color: #a39e94;">PROJECT</label>
    <select id="proj" style="height: 34px; padding: 0 10px; border: 1px solid #6f6a61; border-radius: 6px; background: #0f0e0c; color: #ede9e1; font-size: 13px;">
      <option>Fundraise</option>
      <option>Platform API</option>
      <option>Hiring</option>
    </select>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid #2b2925; border-bottom: 1px solid #2b2925;">
    <div style="display: flex; gap: 10px; align-items: center;">
      <input type="checkbox" id="consent" checked style="width: 15px; height: 15px; accent-color: #8dbfa8;">
      <label for="consent">I've told everyone on the call</label>
    </div>
    <button type="button" style="flex: none; border: 0; padding: 0; background: transparent; color: #8dbfa8; font-size: 12px; font-weight: 600; cursor: pointer;">Copy notice</button>
  </div>

  <a href="MenuRecording.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 42px; border-radius: 6px; background: #8dbfa8; color: #10201a; text-decoration: none; font-weight: 600;">
    <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #10201a;"></span>
    Start recording
  </a>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between;"><span style="color: #a39e94;">System audio</span><span style="color: #8dbfa8;">Allowed</span></div>
    <div style="display: flex; justify-content: space-between;"><span style="color: #a39e94;">Microphone</span><span>MacBook Pro Microphone</span></div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 12px; border-top: 1px solid #2b2925;">
    <a href="Main.dc.html" style="display: flex; justify-content: space-between; padding: 7px 0; color: #ede9e1; text-decoration: none;"><span>Sync with Ada</span><span style="color: #dcac5c;">1 to approve</span></a>
    <a href="#" style="display: flex; justify-content: space-between; padding: 7px 0; color: #ede9e1; text-decoration: none;"><span>Deck review</span><span style="color: #a39e94;">3 Nov</span></a>
    <a href="Main.dc.html" style="padding: 7px 0; font-weight: 600; text-decoration: none;">Open Aftercall</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":470}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
