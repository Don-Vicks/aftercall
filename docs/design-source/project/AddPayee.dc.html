    <span style="color: #a39e94;">How the AI names them, as in "pay Legal review".</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 10px; background: #2c2416;">
    <span style="font-weight: 600;">counsel.near can't receive USDC yet</span>

  </div>

  <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px;">
    <button type="button" style="height: 34px; padding: 0 14px; border: 0; border-radius: 6px; background: transparent; color: #a39e94; font-size: 13px; font-weight: 600; cursor: pointer;">Cancel</button>
    <button type="button" style="height: 34px; padding: 0 18px; border: 0; border-radius: 6px; background: #8dbfa8; color: #10201a; font-size: 13px; font-weight: 600; cursor: pointer;">Add and register in wallet</button>
