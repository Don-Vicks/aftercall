<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aftercall · menu bar, recording</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=swap">
<style>
:root{color-scheme:dark}
body{margin:0;background:#141311}
a{color:#8dbfa8}a:hover{color:#b3d6c5}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 400px; box-sizing: border-box; padding: 16px; background: #24221e; border-radius: 14px; box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 48px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 16px; color: #ede9e1; font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; line-height: 19px;">
  <div style="display: flex; align-items: baseline; justify-content: space-between;">
    <span style="font-family: Newsreader, Georgia, serif; font-size: 18px; line-height: 22px; font-weight: 500;">Aftercall</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; color: #e8775f;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #e8775f; box-shadow: 0 0 0 4px #2e1a15;"></span>RECORDING</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 0 4px;">
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 44px; line-height: 48px; letter-spacing: -0.03em;">03:12</span>
    <span style="color: #a39e94;">Fundraise · Sync with Ada</span>
  </div>

  <div aria-hidden="true" style="display: flex; align-items: center; gap: 3px; height: 40px;">
    <span style="width: 3px; height: 10px; border-radius: 999px; background: #77726a;"></span><span style="width: 3px; height: 22px; border-radius: 999px; background: #77726a;"></span><span style="width: 3px; height: 14px; border-radius: 999px; background: #77726a;"></span><span style="width: 3px; height: 32px; border-radius: 999px; background: #a39e94;"></span><span style="width: 3px; height: 18px; border-radius: 999px; background: #a39e94;"></span><span style="width: 3px; height: 38px; border-radius: 999px; background: #ede9e1;"></span><span style="width: 3px; height: 26px; border-radius: 999px; background: #ede9e1;"></span><span style="width: 3px; height: 12px; border-radius: 999px; background: #a39e94;"></span><span style="width: 3px; height: 30px; border-radius: 999px; background: #ede9e1;"></span><span style="width: 3px; height: 20px; border-radius: 999px; background: #a39e94;"></span><span style="width: 3px; height: 8px; border-radius: 999px; background: #77726a;"></span><span style="width: 3px; height: 24px; border-radius: 999px; background: #a39e94;"></span><span style="width: 3px; height: 34px; border-radius: 999px; background: #ede9e1;"></span><span style="width: 3px; height: 16px; border-radius: 999px; background: #a39e94;"></span><span style="width: 3px; height: 10px; border-radius: 999px; background: #77726a;"></span><span style="width: 3px; height: 28px; border-radius: 999px; background: #a39e94;"></span><span style="width: 3px; height: 14px; border-radius: 999px; background: #77726a;"></span><span style="width: 3px; height: 6px; border-radius: 999px; background: #77726a;"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; justify-content: space-between;"><span style="color: #a39e94;">System audio</span><span>Live</span></div>
    <div style="display: flex; justify-content: space-between;"><span style="color: #a39e94;">Microphone</span><span>Live</span></div>
    <div style="display: flex; justify-content: space-between;"><span style="color: #a39e94;">Saved so far</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px;">1 chunk · 0.8 MB</span></div>
  </div>

  <div style="margin-top: auto; display: flex; gap: 8px;">
    <button type="button" style="flex: 1; height: 42px; border: 1px solid #6f6a61; border-radius: 6px; background: transparent; color: #ede9e1; font-size: 13px; font-weight: 600; cursor: pointer;">Pause</button>
    <a href="Main.dc.html" style="flex: 2; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border-radius: 6px; background: #2e1a15; color: #e8775f; text-decoration: none; font-weight: 600; box-shadow: inset 0 0 0 1px #e8775f;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
      Stop and process
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":400}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
