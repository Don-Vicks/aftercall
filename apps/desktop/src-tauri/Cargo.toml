[package]
name = "aftercall-desktop"
version = "0.1.0"
description = "Aftercall: private meeting notes that do the follow-ups"
authors = ["Victor Shallangwa"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aftercall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# ⌘⇧R from any app (registered from Rust; the interface gets no shortcut permissions).
tauri-plugin-global-shortcut = "2"
# A recovery phrase's Copy button: write it marked concealed, then read back to clear it only if it is still there.
tauri-plugin-clipboard-manager = "2"
# The native Save dialog for a recovery kit (save only; recovery_kit.rs writes the file).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ringbuf = "0.4"
cpal = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
near-tx = { path = "../../../crates/near-tx" }
base64 = "0.22"
bip39 = "2"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
getrandom = "0.2"
bs58 = "0.5"
zeroize = "1"
dcap-qvl = "0.7"
# Already in the tree through Tauri and reqwest; the notes stream's idle timeout needs its timer.
tokio = { version = "1", features = ["time"] }
# Already in the tree through reqwest: the audio upload's TLS check, which runs the usual
# WebPKI validation and also requires the attested gateway key (nearai.rs, PinnedKey).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
webpki-roots = "1"

[dev-dependencies]
# Chunks are written by at_rest::AudioWriter; tests read the decrypted WAV back with hound.
hound = "3.5.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
cidre = { version = "0.15", default-features = false, features = ["async", "av", "blocks", "cm", "core_audio", "dispatch", "macos_15_0"] }
objc2 = "0.6"
objc2-event-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKParticipant", "EKTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSEnumerator", "NSError", "NSString", "NSURL"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
