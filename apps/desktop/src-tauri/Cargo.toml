[package]
name = "aftercall-desktop"
version = "0.1.0"
description = "Aftercall: private meeting notes that do the follow-ups"
authors = ["Victor Shallangwa"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aftercall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ringbuf = "0.4"
hound = "3.5.1"
cpal = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
near-tx = { path = "../../../crates/near-tx" }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.15", default-features = false, features = ["async", "av", "blocks", "cm", "core_audio", "dispatch", "macos_15_0"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
