[package]
name = "agent-wallet"
version = "0.1.0"
edition = "2021"
description = "Aftercall agent wallet: USDC the app may pay out only within limits the owner sets"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
near-workspaces = { version = "0.23", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
